name: Build Cardputer MacroPad Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core and Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install M5Cardputer

      - name: Prepare Sketch Structure
        run: |
          mkdir -p cardputer-macropad
          mv cardputer-macropad.ino cardputer-macropad/

      - name: Compile USB Firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=default \
            --output-dir build-usb cardputer-macropad

      - name: Upload USB Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-macropad-usb-firmware
          path: 'build-usb/**/*.bin'
