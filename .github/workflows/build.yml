name: Build Cardputer MacroPad Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core and Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install M5Cardputer M5GFX M5Unified Preferences

      - name: Compile Sketch
        run: |
          # Create directory structure matching the sketch name if needed, or compile directly
          mkdir -p CardputerMacroPad
          cp *.ino CardputerMacroPad/
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=default,USBMode=default --export-binaries CardputerMacroPad

      - name: Upload Compiled Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-macropad-firmware
          path: CardputerMacroPad/build/**/*.bin
