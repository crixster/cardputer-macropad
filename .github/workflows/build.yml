name: Build Cardputer MacroPad Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core and Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install M5Cardputer
          arduino-cli lib install "NimBLE-Arduino"
          arduino-cli lib install --git-url https://github.com/T-vK/ESP32-BLE-Keyboard.git

      - name: Prepare Sketch Structure and Compile
        run: |
          # Create a proper Arduino sketch folder and move the .ino file into it
          mkdir -p cardputer-macropad
          mv cardputer-macropad.ino cardputer-macropad/

          # Compile the properly structured sketch folder
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=default --export-binaries cardputer-macropad

      - name: Upload Compiled Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-macropad-firmware
          path: '**/build/**/*.bin'
